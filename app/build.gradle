apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google's official sample/test AdMob IDs (https://developers.google.com/admob/android/test-ads).
// Safe to ship: they never serve real ads or earn revenue. Debug builds always use
// this same test banner ID for all four placements below - Google's test ad units are
// placement-agnostic dummy IDs, not meant to be varied per screen.
def testAdmobAppId = "ca-app-pub-3940256099942544~3347511713"
def testBannerAdUnitId = "ca-app-pub-3940256099942544/6300978111"

// Release builds must supply real production IDs via admob.properties (gitignored,
// never committed - see admob.properties.example). Unlike debug, release does NOT
// silently fall back to the sample IDs: a release build with missing/incomplete/
// sample-value config fails with an actionable message naming exactly which values
// are still missing, so it's impossible to accidentally ship (or even locally
// sideload) a "release" build that's secretly still using test ad IDs.
//
// The one sanctioned exception is local release-build testing (checking R8/minification
// behavior, signing, etc. without having real AdMob IDs yet): set
// useTestAdsForLocalRelease=true in admob.properties to explicitly opt in to test ads in
// a release build. This is a deliberate, visible switch in a gitignored file - never a
// default.
def admobPropertiesFile = rootProject.file("admob.properties")
def admobProperties = new Properties()
if (admobPropertiesFile.exists()) {
    admobPropertiesFile.withInputStream { admobProperties.load(it) }
}
def allowTestAdsInRelease = admobProperties.getProperty("useTestAdsForLocalRelease", "false").toBoolean()

// The AdMob App ID is a distinct Google-issued identifier from any ad-unit ID (it
// identifies the *app*, not a placement) and can never be derived from one - it must
// be supplied here directly once available. Until then this stays unset and release
// validation below stays blocked specifically on this field, even if every banner
// below is fully configured.
def configuredAdmobAppId = admobProperties.getProperty("admobAppId")
def hasProductionAdmobAppId = configuredAdmobAppId != null && configuredAdmobAppId != testAdmobAppId

// One banner placement per screen, not a single shared banner. Property names match
// exactly what was supplied for production use.
def bannerPlacements = [
        [property: "tbgMainBanner", resName: "main_banner_ad_unit_id", label: "Home/start screen banner (tbgMainBanner)"],
        [property: "tbgGameBanner", resName: "game_banner_ad_unit_id", label: "Gameplay screen banner (tbgGameBanner)"],
        [property: "tbgScoreBanner", resName: "score_banner_ad_unit_id", label: "Scores screen banner (tbgScoreBanner)"],
        [property: "tbgSettingsBanner", resName: "settings_banner_ad_unit_id", label: "Settings screen banner (tbgSettingsBanner)"],
]
bannerPlacements.each { placement ->
    def configured = admobProperties.getProperty(placement.property)
    placement.configuredValue = configured
    placement.isProduction = configured != null && configured != testBannerAdUnitId
    // Gradle configures every buildType block regardless of which tasks are actually
    // requested, so this must never be null - falls back to the test ID until real
    // release validation (the taskGraph check below) actually gates a release task.
    placement.releaseValue = placement.isProduction ? configured : testBannerAdUnitId
}
def hasProductionAdmobConfig = hasProductionAdmobAppId && bannerPlacements.every { it.isProduction }
def releaseAdmobAppId = hasProductionAdmobAppId ? configuredAdmobAppId : testAdmobAppId

gradle.taskGraph.whenReady { taskGraph ->
    // Exact task-name match only (not startsWith/contains): AGP has plenty of internal
    // tasks whose names contain "release" or start with "bundle"/"assemble"
    // (bundleReleaseClassesToCompileJar, mergeReleaseAssets, etc.) that aren't actually
    // "produce a release artifact" - only these well-known entry-point/lifecycle task
    // names are. "assemble"/"bundle"/"build" are included since they build every variant,
    // including release, when invoked with no variant qualifier.
    def releaseArtifactTaskNames = ["assemble", "assembleRelease", "bundle", "bundleRelease", "build"] as Set
    def buildingRealRelease = taskGraph.allTasks.any { releaseArtifactTaskNames.contains(it.name) }
    if (buildingRealRelease && !hasProductionAdmobConfig && !allowTestAdsInRelease) {
        def missing = []
        if (!hasProductionAdmobAppId) {
            missing << "  - admobAppId: production AdMob App ID - NOT an ad-unit ID, cannot be derived\n" +
                    "    from one. Find it in AdMob console under Apps > (this app) > App settings."
        }
        bannerPlacements.each { placement ->
            if (!placement.isProduction) missing << "  - ${placement.property}: ${placement.label}"
        }
        throw new GradleException(
                "Release build requested, but production AdMob configuration is incomplete.\n" +
                "Missing or still-placeholder values in admob.properties:\n" +
                missing.join("\n") + "\n" +
                "  - Copy admob.properties.example to admob.properties (gitignored) and fill in\n" +
                "    the values above, OR\n" +
                "  - For local release-build testing only (signing/R8/etc, not for distribution),\n" +
                "    add 'useTestAdsForLocalRelease=true' to admob.properties to explicitly opt in\n" +
                "    to Google's sample ad IDs in this release build.\n" +
                "This check exists so a release build can never silently ship with sample or\n" +
                "incomplete ad configuration.")
    }
}

android {
    signingConfigs {
        if (hasSigningConfig) {
            release {
                keyPassword keystoreProperties['keyPassword']
                keyAlias keystoreProperties['keyAlias']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    compileSdk 37
    defaultConfig {
        applicationId "com.tb.tetrisbrick.game"
        minSdkVersion 24
        targetSdkVersion 36
        // Owner-confirmed (2026-09-23) complete Play Console app-bundle list:
        // versionCodes 1-5 exist, 5 is the highest uploaded (production is 5/5.0,
        // internal testing 1/1.0). 6 is therefore the next available versionCode
        // across ALL tracks, not just production - see CLAUDE_PROGRESS.md.
        versionCode 6
        versionName "6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            // Installs as a separate package (com.tb.tetrisbrick.game.debug) alongside
            // any existing release install of the app, instead of conflicting with it -
            // a debug-signed build can never be installed over a release-signed one
            // anyway (signature mismatch), so without this, testing on a device that
            // already has the real app would require uninstalling it first and losing
            // its saved scores. This never affects release builds.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "admob_app_id", testAdmobAppId
            bannerPlacements.each { placement ->
                resValue "string", placement.resName, testBannerAdUnitId
            }
            buildConfigField "boolean", "ADS_CONFIGURED_FOR_RELEASE", "false"
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasSigningConfig) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "admob_app_id", releaseAdmobAppId
            bannerPlacements.each { placement ->
                resValue "string", placement.resName, placement.releaseValue
            }
            buildConfigField "boolean", "ADS_CONFIGURED_FOR_RELEASE", hasProductionAdmobConfig.toString()
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    namespace 'com.tb.tetrisbrick.game'
}

dependencies {
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    implementation 'io.github.ShawnLin013:number-picker:2.4.13'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'

    implementation "androidx.core:core-ktx:1.19.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    androidTestImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
repositories {
    google()
    mavenCentral()
}

